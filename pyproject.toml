[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogpt-modern"
version = "0.3.0"
description = "端到端轻量级大语言模型训练-推理-对齐全栈框架"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "nanoGPT-Modern Contributors"},
]
keywords = ["llm", "gpt", "transformer", "pretraining", "rlhf", "grpo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # ~=2.5 locks the SDPA enable_gqa lower bound (torch>=2.5); the <2.9 cap keeps
    # resolution on the cu12x wheel series and avoids silent cu13 forks per Python version.
    "torch~=2.5, <2.9",
    "numpy",
    "tiktoken",
    "tensorboard",
    "wandb",
    "pyyaml",
    "datasets",
    "huggingface_hub",
    "safetensors",
    "omegaconf",
    "hydra-core",
    "pytest",
]

[project.optional-dependencies]
eval = ["lm-eval>=0.4.0"]
quant = ["bitsandbytes>=0.41.0", "gguf>=0.6.0"]
hf = ["transformers"]
plot = ["matplotlib>=3.7.0"]
server = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "pydantic>=2.0"]
validate = ["pydantic>=2.0"]
dev = ["pytest", "black", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
nanogpt-prepare = "data.prepare:main"
nanogpt-train-pretrain = "training.train_pretrain:main"
nanogpt-train-sft = "training.train_sft:main"
nanogpt-train-grpo = "training.train_grpo:main"
nanogpt-train-dpo = "training.train_dpo:main"
nanogpt-train-iterative-grpo = "training.iterative_grpo:main"
nanogpt-generate = "inference.generate:main"
nanogpt-eval-alignment = "evaluation.eval_alignment:main"
nanogpt-export-gguf = "tools.export.export_gguf:main"
nanogpt-export-hf = "tools.export.export_to_hf:main"
nanogpt-load-hf = "tools.export.load_from_hf:main"
# Hydra / OmegaConf entry points (M23)
nanogpt-train-pretrain-hydra = "training.train_pretrain_hydra:main"
nanogpt-train-sft-hydra = "training.train_sft_hydra:main"
nanogpt-train-grpo-hydra = "training.train_grpo_hydra:main"
nanogpt-train-dpo-hydra = "training.train_dpo_hydra:main"
nanogpt-train-iterative-grpo-hydra = "training.iterative_grpo_hydra:main"
nanogpt-generate-hydra = "inference.generate_hydra:main"
nanogpt-eval-benchmark-hydra = "evaluation.eval_benchmark_hydra:main"
# Component ablation orchestrator (AR-v0.4.0 FR4)
nanogpt-ablations = "run_component_ablations:main"


# Mypy is not able to narrow PyTorch module/Tensor unions in these modules;
# disable the noisy error categories so the rest of the type-checking still runs.
[[tool.mypy.overrides]]
module = [
    "model.modern_gpt",
    "model.quantization",
    "inference.generate_utils",
    "tools.export.export_to_onnx",
    "evaluation.needle_in_haystack",
    "evaluation.eval_win_rate",
    "inference.visualize_attention",
    "inference.continuous_batching",
    "api_server",
]
disable_error_code = ["union-attr", "operator", "arg-type", "misc", "return-value", "assignment"]
[tool.black]
target-version = ["py39"]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "data*", "training*", "inference*", "evaluation*", "rewards*", "utils*", "config*", "tools*"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
no_namespace_packages = true
exclude = ["tests/"]

[tool.pytest.ini_options]
pythonpath = ["."]
